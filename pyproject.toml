[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "localagentbrowser"
version = "1.39"
description = "An autonomous web agent driven by a local LLM (LM Studio) and Playwright. Runs entirely on your own machine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SnowFX" }]
requires-python = ">=3.10"
dependencies = [
    "openai>=2.0",
    "playwright>=1.50",
]
keywords = [
    "ai-agent", "autonomous-agent", "llm", "local-llm", "lm-studio", "playwright",
    "browser-automation", "web-agent", "web-research", "qwen", "offline-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15"]

[project.scripts]
localagentbrowser = "agent_browser:run"

[project.urls]
Homepage = "https://github.com/SnowFXXX/LocalAgentBrowser"
Changelog = "https://github.com/SnowFXXX/LocalAgentBrowser/blob/main/CHANGELOG.md"
Issues = "https://github.com/SnowFXXX/LocalAgentBrowser/issues"

[tool.setuptools]
py-modules = ["agent_browser"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
# Long lines are mostly prompt text, which reads better unwrapped
ignore = ["E501"]
